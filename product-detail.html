<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Thư Hiên | Chi tiết sách</title>
    <link rel="icon" type="image/jpeg" href="assets/images/logo.jpg" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Noto+Sans:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <!--Nhúng css-->
    <link rel="stylesheet" href="assets/css/style.css" />
    <link rel="stylesheet" href="assets/css/product-detail.css" />
  </head>
  <body>
    <!-- ==========NHÚNG HEADER ========== -->
    <div id="header"></div>

    <main class="detail-page">
      <div class="container-custom">
        <div class="breadcrumb">
          <a href="index.html">Trang chủ</a> &rsaquo;
          <a href="category.html">Danh mục sách</a> &rsaquo; Chi tiết sách
        </div>
        <div class="detail-container">
          <div class="product-top-section">
            <div class="product-gallery">
              <div class="main-image-box">
                <img
                  id="detail-img"
                  src="assets/images/logo.png"
                  alt="Ảnh sách"
                />
                <button class="zoom-btn">
                  <i class="fas fa-search-plus"></i>
                </button>
              </div>
            </div>

            <div class="product-info-box">
              <h2 class="product-title" id="detail-title">
                ĐANG TẢI DỮ LIỆU...
              </h2>

              <ul class="meta-info">
                <li>
                  <strong>Tác giả:</strong> <span id="detail-author"></span>
                </li>
              </ul>
              <div class="product-rating" id="detail-rating">
                <span>(Đang tải đánh giá...)</span>
              </div>
              <div class="price-box">
                <span class="new-price" id="detail-price"></span>
              </div>

              <div class="info-grid">
                <p>
                  Thể loại:
                  <strong id="detail-category" class="text-highlight"></strong>
                </p>
                <p>
                  Tình trạng: <strong class="text-success">Còn hàng</strong>
                </p>
                <p>Năm XB: <strong id="detail-year"></strong></p>
                <p>Nhà XB: <strong id="detail-publisher"></strong></p>
              </div>

              <div class="cart-action">
                <div class="qty-selector">
                  <button type="button" class="qty-btn" onclick="decreaseQty()">
                    -
                  </button>
                  <input
                    type="number"
                    id="qty"
                    value="1"
                    min="1"
                    class="qty-input"
                  />
                  <button type="button" class="qty-btn" onclick="increaseQty()">
                    +
                  </button>
                </div>
                <button class="btn-add-cart">
                  <i class="fas fa-cart-plus"></i> Thêm vào giỏ
                </button>
                <button class="btn-buy-now-detail">Mua ngay</button>
              </div>
            </div>
          </div>

          <div class="product-bottom-section">
            <div class="tab-section">
              <div
                class="detail-tabs"
                role="tablist"
                aria-label="Thông tin chi tiết sách"
              >
                <button
                  class="detail-tab-btn active"
                  type="button"
                  data-tab="description"
                  role="tab"
                  aria-selected="true"
                >
                  MÔ TẢ
                </button>
                <button
                  class="detail-tab-btn"
                  type="button"
                  data-tab="reviews"
                  role="tab"
                  aria-selected="false"
                >
                  ĐÁNH GIÁ
                </button>
              </div>

              <div
                class="tab-panel active"
                id="description-panel"
                role="tabpanel"
              >
                <div class="description-content">
                  <p id="detail-description" style="white-space: pre-line">
                    Đang tải mô tả...
                  </p>
                </div>
              </div>

              <div class="tab-panel" id="reviews-panel" role="tabpanel">
                <h3 class="review-panel-title">
                  <i class="fas fa-star-half-alt"></i>
                  Đánh giá từ độc giả
                </h3>

                <div class="review-summary">
                  <div class="review-score-box">
                    <div class="review-score-number">
                      <strong id="review-average">0.0</strong><span>/5</span>
                    </div>
                    <div
                      class="review-average-stars"
                      id="review-average-stars"
                    ></div>
                    <p class="review-summary-text">
                      Dựa trên <strong id="review-count">0</strong> đánh giá
                    </p>
                  </div>

                  <div class="review-breakdown" id="review-breakdown"></div>
                </div>

                <div class="review-list" id="review-list"></div>
              </div>
            </div>

            <div class="tab-section mt-40">
              <h3 class="section-heading">GỢI Ý</h3>
              <div class="related-grid" id="related-books-grid"></div>
            </div>
          </div>
        </div>
      </div>
    </main>
    <!-- ==========NHÚNG FOOTER ========== -->
    <div id="footer"></div>

    <script src="assets/js/style.js"></script>
    <script src="assets/js/data.js"></script>
    <script src="assets/js/product-detail.js"></script>

    <!-- ================= HỘP QUÀ NỔI TÍCH HỢP ================= -->
    <div id="khu-vuc-qua-tang">
      <a
        href="box.html"
        class="nut-gieo-que-lo-lung"
        data-tooltip="Hãy ấn vào để gieo quẻ nhận quà"
      >
        <img
          src="assets/images/box.png"
          alt="Ống quẻ Thư Hiên"
          class="ong-que-img-lo-lung"
        />
      </a>
    </div>

    <!--  ĐOẠN SCRIPT FETCH MỚI (Đã tối ưu để kích hoạt lại các hàm active) -->
    <script>
      function taiComponent(elementId, url, callback) {
        const container = document.getElementById(elementId);
        if (!container) return;

        fetch(url)
          .then((res) => {
            if (!res.ok) throw new Error(`Không tìm thấy file: ${url}`);
            return res.text();
          })
          .then((data) => {
            container.innerHTML = data;

            // Kích hoạt các thẻ <script> nằm bên trong file component (nếu có)
            container.querySelectorAll("script").forEach((oldScript) => {
              const newScript = document.createElement("script");
              if (oldScript.src) newScript.src = oldScript.src;
              else newScript.textContent = oldScript.textContent;
              document.body.appendChild(newScript);
              oldScript.remove();
            });

            // 🔥 QUAN TRỌNG: Gọi hàm callback để chạy các hàm active sau khi Header/Footer đã lên hình
            if (callback) callback();
          })
          .catch((err) => console.error("Lỗi tải component:", err));
      }

      // Thực thi khi trang tải xong
      document.addEventListener("DOMContentLoaded", function () {
        // Tải Header từ thư mục components
        taiComponent("header", "components/header.html", function () {
          // 1. Kích hoạt tính năng tìm kiếm/giỏ hàng của Thư Hiên
          if (typeof window.initThuhienHeader === "function") {
            window.initThuhienHeader();
          }

          // 2. Kích hoạt hàm đổi màu Active của cậu (Ví dụ tên hàm là xử lý active)
          // Cậu kiểm tra xem trong style.js cậu đặt tên hàm active là gì thì gọi ở đây nhé:
          if (typeof window.initActiveMenu === "function") {
            window.initActiveMenu();
          } else if (typeof window.xuLyActiveMenu === "function") {
            window.xuLyActiveMenu();
          }
        });

        // Tải Footer
        taiComponent("footer", "components/footer.html");
      });
    </script>
  </body>
</html>
