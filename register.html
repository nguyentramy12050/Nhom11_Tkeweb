<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title> Đăng ký | Thư Hiên </title>
    <link rel="icon" type="image/jpeg" href="assets/images/logo.jpg">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Noto+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<!--Nhúng css-->
    <link rel="stylesheet" href="assets/css/style.css" />
    <link rel="stylesheet" href="assets/css/auth.css" />
  </head>

  <body>
    <main class="auth-page register-page">
      <section class="register-shell">
        <div class="register-image">
          <div class="image-overlay">
            <h2>Gìn giữ tri thức</h2>
            <p>Sách là nơi lưu giữ những linh hồn của quá khứ.</p>
          </div>
        </div>

        <div class="register-card">
          <a href="index.html" class="register-logo">
            <i class="fas fa-user-plus"></i>
            <span>TẠO TÀI KHOẢN MỚI</span>
          </a>

          <form id="register-form" novalidate>
            <div class="form-group">
              <label for="register-name">Họ tên</label>
              <input
                type="text"
                id="register-name"
                placeholder="Nguyễn Văn A"
              />
              <small class="form-error"></small>
            </div>

            <div class="form-group">
              <label for="register-email">Email</label>
              <input
                type="email"
                id="register-email"
                placeholder="example@thu-hien.vn"
              />
              <small class="form-error"></small>
            </div>

            <div class="form-group">
              <label for="register-phone">Số điện thoại</label>
              <input type="tel" id="register-phone" placeholder="0901234567" />
              <small class="form-error"></small>
            </div>

            <div class="form-group">
              <label for="register-password">Mật khẩu</label>
              <div class="password-box">
                <input
                  type="password"
                  id="register-password"
                  placeholder="Tối thiểu 6 ký tự"
                />
                <button
                  type="button"
                  class="toggle-password"
                  data-target="register-password"
                  aria-label="Hiện hoặc ẩn mật khẩu"
                >
                  <i class="far fa-eye"></i>
                </button>
              </div>
              <small class="form-error"></small>
            </div>

            <div class="form-group">
              <label for="register-confirm-password">Nhập lại mật khẩu</label>
              <div class="password-box">
                <input
                  type="password"
                  id="register-confirm-password"
                  placeholder="Nhập lại mật khẩu"
                />
                <button
                  type="button"
                  class="toggle-password"
                  data-target="register-confirm-password"
                  aria-label="Hiện hoặc ẩn mật khẩu"
                >
                  <i class="far fa-eye"></i>
                </button>
              </div>
              <small class="form-error"></small>
            </div>

            <label class="agree-policy">
              <input type="checkbox" id="agree-policy" />
              <span>Tôi đồng ý với chính sách bảo mật của Thư Hiên.</span>
            </label>
            <small class="form-error policy-error" id="policy-error"></small>

            <button type="submit" class="auth-btn">
              Gia nhập Thư Hiên <i class="fas fa-feather-alt"></i>
            </button>

            <p class="auth-message" id="register-message"></p>
          </form>

          <div class="auth-switch">
            <span>Đã có tài khoản?</span>
            <a href="login.html">Đăng nhập ngay</a>
          </div>
        </div>
      </section>
    </main>

    <script src="assets/js/auth.js"></script>
  </body>
</html>
