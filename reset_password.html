<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Đặt lại mật khẩu | Thư Hiên</title>
    <link rel="icon" type="image/jpeg" href="assets/images/logo.jpg" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Noto+Sans:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <!--Nhúng css-->
    <link rel="stylesheet" href="assets/css/style.css" />
    <link rel="stylesheet" href="assets/css/auth.css" />
  </head>

  <body>
    <main class="auth-page login-page">
      <section class="login-card forgot-card">
        <a href="index.html" class="auth-logo">Thư Hiên</a>

        <h1>Đặt lại mật khẩu</h1>

        <form id="verify-form" novalidate>
          <div class="form-group">
            <label for="verify-code">Mã xác thực</label>
            <input
              type="text"
              id="verify-code"
              maxlength="6"
              placeholder="Nhập mã 6 số"
            />
            <small class="form-error"></small>
          </div>

          <div class="form-group">
            <label for="new-password">Mật khẩu mới</label>
            <div class="password-box">
              <input
                type="password"
                id="new-password"
                placeholder="Tối thiểu 6 ký tự"
              />
              <button
                type="button"
                class="toggle-password"
                data-target="new-password"
                aria-label="Hiện hoặc ẩn mật khẩu"
              >
                <i class="far fa-eye"></i>
              </button>
            </div>
            <small class="form-error"></small>
          </div>

          <div class="form-group">
            <label for="confirm-new-password">Nhập lại mật khẩu mới</label>
            <div class="password-box">
              <input
                type="password"
                id="confirm-new-password"
                placeholder="Nhập lại mật khẩu mới"
              />
              <button
                type="button"
                class="toggle-password"
                data-target="confirm-new-password"
                aria-label="Hiện hoặc ẩn mật khẩu"
              >
                <i class="far fa-eye"></i>
              </button>
            </div>
            <small class="form-error"></small>
          </div>

          <button type="submit" class="auth-btn">
            Đặt lại mật khẩu
            <i class="fas fa-key"></i>
          </button>

          <p class="auth-message" id="reset-message"></p>
        </form>

        <div class="auth-switch">
          <span>Chưa nhận được mã?</span>
          <a href="forgot_password.html">Gửi lại mã</a>
        </div>
      </section>
    </main>

    <script src="assets/js/auth.js"></script>
  </body>
</html>
