<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Quên mật khẩu | Thư Hiên</title>

    <link rel="icon" type="image/jpeg" href="assets/images/logo.jpg" />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Noto+Sans:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="assets/css/auth.css" />

    <!-- EmailJS dùng để gửi mã xác thực qua email -->
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  </head>

  <body>
    <main class="auth-page login-page">
      <section class="login-card forgot-card">
        <a href="index.html" class="auth-logo">Thư Hiên</a>

        <h1>Khôi phục mật khẩu</h1>

        <form id="forgot-form" novalidate>
          <div class="form-group">
            <label for="forgot-email">Email tài khoản</label>
            <input
              type="email"
              id="forgot-email"
              placeholder="example@thuhien.vn"
            />
            <small class="form-error"></small>
          </div>

          <button type="submit" class="auth-btn">
            Gửi mã xác thực
            <i class="fas fa-paper-plane"></i>
          </button>

          <p class="auth-message" id="forgot-message"></p>
        </form>

        <form id="verify-form" class="hidden-form" novalidate>
          <div class="form-group">
            <label for="verify-code">Mã xác thực</label>
            <input
              type="text"
              id="verify-code"
              maxlength="6"
              placeholder="Nhập mã 6 số"
            />
            <small class="form-error"></small>
          </div>

          <div class="form-group">
            <label for="new-password">Mật khẩu mới</label>
            <div class="password-box">
              <input
                type="password"
                id="new-password"
                placeholder="Tối thiểu 6 ký tự"
              />
              <button
                type="button"
                class="toggle-password"
                data-target="new-password"
                aria-label="Hiện hoặc ẩn mật khẩu"
              >
                <i class="far fa-eye"></i>
              </button>
            </div>
            <small class="form-error"></small>
          </div>

          <div class="form-group">
            <label for="confirm-new-password">Nhập lại mật khẩu mới</label>
            <div class="password-box">
              <input
                type="password"
                id="confirm-new-password"
                placeholder="Nhập lại mật khẩu mới"
              />
              <button
                type="button"
                class="toggle-password"
                data-target="confirm-new-password"
                aria-label="Hiện hoặc ẩn mật khẩu"
              >
                <i class="far fa-eye"></i>
              </button>
            </div>
            <small class="form-error"></small>
          </div>

          <button type="submit" class="auth-btn">
            Đặt lại mật khẩu
            <i class="fas fa-key"></i>
          </button>

          <p class="auth-message" id="reset-message"></p>
        </form>

        <div class="auth-switch">
          <span>Đã nhớ mật khẩu?</span>
          <a href="login.html">Đăng nhập</a>
        </div>
      </section>
    </main>

    <script src="assets/js/emailjs-config.js"></script>
    <script src="assets/js/auth.js"></script>
  </body>
</html>
