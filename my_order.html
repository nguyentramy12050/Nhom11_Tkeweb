<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title> Đơn hàng của tôi | Thư Hiên </title>
    <link rel="icon" type="image/jpeg" href="assets/images/logo.jpg">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Noto+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<!--Nhúng css-->
    <link rel="stylesheet" href="assets/css/style.css" />
    <link rel="stylesheet" href="assets/css/my_order.css" />
  </head>

  <body>
    <!-- ==========NHÚNG HEADER ========== -->
    <div id="header"></div>
    <main class="orders-page">
      <section class="orders-container">
        <div class="orders-topline">
          <div class="breadcrumb">
            <a href="my_order.html">Sách của tôi</a>
            <span class="breadcrumb-separator">/</span>
            <span>Đơn hàng của tôi</span>
          </div>

          <div class="orders-status-filter">
            <label for="order-status-filter">Trạng thái</label>
            <select id="order-status-filter">
              <option value="all">Tất cả trạng thái</option>
              <option value="confirmed">Xác nhận</option>
              <option value="packed">Đóng gói</option>
              <option value="shipping">Đang giao</option>
              <option value="completed">Hoàn tất</option>
            </select>
          </div>
        </div>

        <section id="orders-list" class="orders-list"></section>

        <section id="orders-empty" class="orders-empty">
          <i class="fas fa-box-open"></i>
          <h2>Bạn chưa có đơn hàng nào</h2>
          <p>
            Hãy chọn một vài cuốn sách cũ để bắt đầu hành trình sưu tầm của
            mình.
          </p>
          <a href="category.html">Xem danh mục sách</a>
        </section>
      </section>
    </main>
<!-- ==========NHÚNG FOOTER ========== -->
    <div id="footer"></div>

    <script src="assets/js/components.js"></script>
    <script src="assets/js/style.js"></script>
    <script src="assets/js/data.js"></script>
    <script src="assets/js/my_order.js"></script>

    <!-- ================= HỘP QUÀ NỔI TÍCH HỢP ================= -->
<div id="khu-vuc-qua-tang">
    
    <a href="box.html" class="nut-gieo-que-lo-lung" data-tooltip="Hãy ấn vào để gieo quẻ nhận quà">
        <img src="assets/images/box.png" alt="Ống quẻ Thư Hiên" class="ong-que-img-lo-lung">
    </a>
</div>

<!--  ĐOẠN SCRIPT FETCH MỚI (Đã tối ưu để kích hoạt lại các hàm active) -->
    <script>
        function taiComponent(elementId, url, callback) {
            const container = document.getElementById(elementId);
            if (!container) return;

            fetch(url)
                .then(res => {
                    if (!res.ok) throw new Error(`Không tìm thấy file: ${url}`);
                    return res.text();
                })
                .then(data => {
                    container.innerHTML = data;
                    
                    // Kích hoạt các thẻ <script> nằm bên trong file component (nếu có)
                    container.querySelectorAll("script").forEach(oldScript => {
                        const newScript = document.createElement("script");
                        if (oldScript.src) newScript.src = oldScript.src;
                        else newScript.textContent = oldScript.textContent;
                        document.body.appendChild(newScript);
                        oldScript.remove();
                    });

                    // 🔥 QUAN TRỌNG: Gọi hàm callback để chạy các hàm active sau khi Header/Footer đã lên hình
                    if (callback) callback();
                })
                .catch(err => console.error("Lỗi tải component:", err));
        }

        // Thực thi khi trang tải xong
        document.addEventListener("DOMContentLoaded", function () {
            
            // Tải Header từ thư mục components
            taiComponent('header', 'components/header.html', function() {
                
                // 1. Kích hoạt tính năng tìm kiếm/giỏ hàng của Thư Hiên
                if (typeof window.initThuhienHeader === "function") {
                    window.initThuhienHeader();
                }
                
                // 2. Kích hoạt hàm đổi màu Active của cậu (Ví dụ tên hàm là xử lý active)
                // Cậu kiểm tra xem trong style.js cậu đặt tên hàm active là gì thì gọi ở đây nhé:
                if (typeof window.initActiveMenu === "function") {
                    window.initActiveMenu();
                } else if (typeof window.xuLyActiveMenu === "function") {
                    window.xuLyActiveMenu();
                }
                
            });

            // Tải Footer
            taiComponent('footer', 'components/footer.html');
        });
    </script>
  </body>
</html>
