<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title> Đăng nhập | Thư Hiên </title>
    <link rel="icon" type="image/jpeg" href="assets/images/logo.jpg">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Noto+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<!--Nhúng css-->
    <link rel="stylesheet" href="assets/css/style.css" />

    <link rel="stylesheet" href="assets/css/auth.css" />
  </head>

  <body>
    <main class="auth-page login-page">
      <section class="login-card">
        <a href="index.html" class="auth-logo">Thư Hiên</a>

        <h1>Chào mừng bạn trở lại</h1>

        <form id="login-form" novalidate>
          <div class="form-group">
            <label for="login-email">Email</label>
            <input
              type="email"
              id="login-email"
              placeholder="example@thuhien.vn"
            />
            <small class="form-error"></small>
          </div>

          <div class="form-group">
            <label for="login-password">Mật khẩu</label>
            <div class="password-box">
              <input
                type="password"
                id="login-password"
                placeholder="Nhập mật khẩu"
              />
              <button
                type="button"
                class="toggle-password"
                data-target="login-password"
                aria-label="Hiện hoặc ẩn mật khẩu"
              >
                <i class="far fa-eye"></i>
              </button>
            </div>
            <small class="form-error"></small>
          </div>

          <div class="auth-row">
            <label class="remember-me">
              <input type="checkbox" id="remember-login" />
              <span>Lưu đăng nhập</span>
            </label>

            <a href="forgot_password.html" class="small-link">Quên mật khẩu?</a>
          </div>

          <button type="submit" class="auth-btn">
            Đăng nhập <i class="fas fa-sign-in-alt"></i>
          </button>

          <p class="auth-message" id="login-message"></p>
        </form>

        <div class="auth-switch">
          <span>Chưa có tài khoản?</span>
          <a href="register.html">Đăng ký tài khoản mới</a>
        </div>
      </section>
    </main>

    <script src="assets/js/auth.js"></script>
  </body>
</html>
